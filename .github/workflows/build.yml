name: Build RustDesk

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'

env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  CARGO_EXPAND_VERSION: "1.0.95"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"

jobs:
  generate-bridge:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libclang-dev llvm-dev libgtk-3-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge

      - name: Install flutter + bridge tools
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: stable
          flutter-version: "3.22.3"
          architecture: x64

      - name: Install codegen tools
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked

      - name: Prepare flutter
        working-directory: flutter
        run: |
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' pubspec.yaml
          flutter pub get

      - name: Run flutter rust bridge codegen
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  build:
    needs: generate-bridge
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            flutter-arch: x64

          # - name: Linux x64
          #   os: ubuntu-22.04
          #   target: x86_64-unknown-linux-gnu
          #   flutter-arch: x64

          # - name: macOS x64
          #   os: macos-13
          #   target: x86_64-apple-darwin
          #   flutter-arch: x64

          # - name: macOS ARM64
          #   os: macos-14
          #   target: aarch64-apple-darwin
          #   flutter-arch: arm64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply custom server config
        shell: bash
        run: |
          sed -i.bak 's/rs-ny.rustdesk.com/rustdesk.foxhank.cn/g' libs/hbb_common/src/config.rs
          sed -i.bak 's|OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=|20050723|g' libs/hbb_common/src/config.rs
          rm -f libs/hbb_common/src/config.rs.bak

      - name: Download bridge artifacts
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./
          merge-multiple: true

      - name: Install LLVM and Clang
        if: runner.os != 'macOS'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libpam0g-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libva-dev libva-drm2 libasound2-dev

      - name: Install flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: ${{ matrix.flutter-arch }}

      - name: Patch flutter
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Replace flutter engine (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Enable Windows long path support
        if: runner.os == 'Windows'
        shell: powershell
        run: Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1

      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.name }}

      - name: Build Rust lib (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cargo build --locked --lib --release

      - name: Build Rust lib (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --locked --features hwcodec --lib --release
          sed -i 's/ffi.NativeFunction<ffi.Bool Function(DartPort/ffi.NativeFunction<ffi.Uint8 Function(DartPort/g' flutter/lib/generated_bridge.dart

      - name: Build Rust lib (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo build --locked --lib --release
          cp target/release/liblibrustdesk.dylib target/release/librustdesk.dylib

      - name: Build Flutter (Windows)
        if: runner.os == 'Windows'
        working-directory: flutter
        shell: powershell
        run: flutter build windows --release

      - name: Build Flutter (Linux)
        if: runner.os == 'Linux'
        working-directory: flutter
        shell: bash
        run: flutter build linux --release

      - name: Build Flutter (macOS)
        if: runner.os == 'macOS'
        working-directory: flutter
        shell: bash
        run: flutter build macos --release

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-Windows-x64
          path: flutter/build/windows/x64/runner/Release/

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-Linux-x64
          path: flutter/build/linux/x64/release/bundle/

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-${{ matrix.name }}
          path: flutter/build/macos/Build/Products/Release/

  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_PAT }}
          tag_name: ${{ github.ref_name }}
          name: RustDesk ${{ github.ref_name }}
          body: Custom build for foxhank server
          draft: false
          prerelease: false
          files: ./release/**/*

