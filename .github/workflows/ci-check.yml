name: CI Check

# Lightweight compile/test validation (no flutter bundle, no vcpkg ffmpeg):
# enough to type-check the whole workspace and run hbb_common unit tests.
on:
  workflow_dispatch:
  push:
    branches: [rsync-incremental]

jobs:
  check-windows:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
      VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.75"

      - uses: Swatinem/rust-cache@v2

      - name: Install LLVM (for bindgen in magnum-opus)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "15.0.6"

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies (full manifest, like upstream builds)
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: cargo check (whole workspace)
        shell: bash
        run: cargo check --features flutter 2>&1 | tail -100

      - name: cargo test hbb_common
        shell: bash
        run: cargo test -p hbb_common --lib 2>&1 | tail -50
